<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>商品編輯器｜Cookie くま</title><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="style.css"><style>body{padding:30px}.editor{max-width:1000px;margin:auto}.editor h1{font-size:30px}.editor-layout{display:grid;grid-template-columns:240px 1fr;gap:30px;margin:25px 0}.product-list{display:flex;flex-direction:column;gap:8px}.product-list button{text-align:left;padding:12px;background:#eee5d6;border:1px solid #ded5c7}.product-list button.selected{border:2px solid #89654b}.editor label{display:block;font-size:12px;margin-bottom:16px}.editor input:not([type=checkbox]),.editor textarea,.editor select{display:block;width:100%;padding:11px;background:#fff;border:1px solid #ded5c7;margin-top:6px;font:inherit}.editor textarea{min-height:100px}.editor p{font-size:12px}.editor-actions{display:flex;gap:10px;flex-wrap:wrap}.editor .button{border:0}.editor-preview{display:flex;flex-wrap:wrap;gap:12px;margin-block:15px}.editor-preview>div{width:100px}.editor-preview img{width:100px;height:100px;object-fit:cover}.editor-preview button{font-size:10px;padding:5px;background:none;border:1px solid #ded5c7;margin-top:5px}.notice{background:#eee5d6;padding:15px 20px}#status{color:#69735b}@media(max-width:650px){body{padding:20px}.editor-layout{grid-template-columns:1fr}.product-list{flex-direction:row;overflow:auto}.product-list button{min-width:145px}}</style><script src="products.js"></script></head><body><main class="editor"><a href="index.html">← 回到網站</a><h1>Cookie くま 商品編輯器</h1><p class="notice">在這裡改商品、放照片，完成後下載 <strong>products.js</strong>，再上傳到你的 GitHub 網站專案，網站就會更新。這裡的修改只在目前頁面中，關閉前請記得下載。</p><div class="editor-actions"><button id="add" class="button">＋ 新增商品</button><button id="download" class="button">下載商品資料 ↓</button></div><p id="status" aria-live="polite"></p><div class="editor-layout"><aside id="list" class="product-list" aria-label="商品清單"></aside><form id="form"><label>商品名稱<input id="name" required></label><label>顏色／花色名稱<input id="variant" required></label><label>分類<select id="category"><option value="bag">飲料提袋</option><option value="wallet">手作錢包</option></select></label><label>商品標籤<input id="tag"></label><label>色票<input id="color" type="color"></label><label>商品說明<textarea id="description"></textarea></label><label><input id="visible" type="checkbox"> 在網站上顯示這個商品（取消勾選即下架）</label><label>新增商品照片（可多選；自動縮圖）<input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><p>第一張為封面，可按「設為封面」調整。</p><div id="preview" class="editor-preview"></div></form></div><p>只有擁有 GitHub 專案寫入權限的人可以發布更新；此編輯器不會自動將修改上傳。網站價格與庫存仍由 IG 私訊確認。</p></main><script>
let items=structuredClone(window.COOKIE_PRODUCTS||[]),selected=0,dirty=false,processing=false;
const $=id=>document.getElementById(id);const fields=['name','variant','category','tag','color','description','visible'];
function list(){ $('list').replaceChildren();items.forEach((p,i)=>{const b=document.createElement('button');b.type='button';b.textContent=p.name+'・'+p.variant+(p.visible===false?'（已下架）':'');b.classList.toggle('selected',i===selected);b.onclick=()=>{selected=i;edit();};$('list').append(b);});}
function edit(){list();const p=items[selected];if(!p)return;for(const k of fields){if(k==='visible')$(k).checked=p.visible!==false;else $(k).value=p[k]||'';}preview();}
function preview(){const p=items[selected];$('preview').replaceChildren();[...new Set([p.image,...(p.images||[])])].filter(Boolean).forEach(src=>{const box=document.createElement('div'),im=document.createElement('img'),cover=document.createElement('button'),del=document.createElement('button');im.src=src;im.alt='商品照片';cover.type=del.type='button';cover.textContent=src===p.image?'目前封面':'設為封面';cover.onclick=()=>{p.image=src;dirty=true;preview();};del.textContent='移除';del.onclick=()=>{const remaining=[...new Set([p.image,...(p.images||[])])].filter(x=>x!==src);if(!remaining.length){$('status').textContent='每個商品至少保留一張照片，請先新增照片。';return;}p.images=remaining;if(p.image===src)p.image=remaining[0];dirty=true;preview();};box.append(im,cover,del);$('preview').append(box);});}
for(const k of fields)$(k).addEventListener('input',()=>{items[selected][k]=k==='visible'?$(k).checked:$(k).value;dirty=true;list();});
$('form').onsubmit=e=>e.preventDefault();
$('add').onclick=()=>{items.push({id:'product-'+Date.now(),name:'新商品',variant:'請填寫花色',category:'wallet',tag:'手作小物',color:'#b88c64',image:'assets/favicon.png',images:[],description:'請填寫商品介紹',visible:true});selected=items.length-1;dirty=true;edit();};
$('photos').onchange=async e=>{const product=items[selected];const files=[...e.target.files];if(!files.length)return;processing=true;$('download').disabled=true;$('status').textContent='正在整理照片…';try{for(const file of files){if(file.size>20*1024*1024)throw Error('照片超過 20MB，請改用較小的照片。');const bitmap=await createImageBitmap(file);const ratio=Math.min(1,1200/Math.max(bitmap.width,bitmap.height));const c=document.createElement('canvas');c.width=Math.round(bitmap.width*ratio);c.height=Math.round(bitmap.height*ratio);c.getContext('2d').drawImage(bitmap,0,0,c.width,c.height);bitmap.close();const data=c.toDataURL('image/jpeg',.84);if(product.image==='assets/favicon.png')product.image=data;product.images.push(data);}dirty=true;preview();$('status').textContent='照片已加入，完成編輯後請下載商品資料。';}catch(err){$('status').textContent='照片處理失敗：'+err.message;}finally{processing=false;$('download').disabled=false;$('photos').value='';}};
$('download').onclick=()=>{if(processing)return;if(items.some(p=>!p.name.trim()||!p.variant.trim())){$('status').textContent='請先填寫每個商品的名稱及花色。';return;}const blob=new Blob(['// Cookie くま 商品資料\nwindow.COOKIE_PRODUCTS = '+JSON.stringify(items,null,2)+';\n'],{type:'text/javascript;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='products.js';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);dirty=false;$('status').textContent='已下載 products.js！請上傳至 GitHub 專案，取代原本同名檔案並提交變更。';};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});edit();
</script></body></html>
